[package]
name = "onsa-downloader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
flate2.workspace = true
lzma-rs.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tracing.workspace = true
zip.workspace = true

# Stopping a program together with everything it started (SPEC §7.3). Both
# of these are already in the tree — Tauri and cpal bring them — so nothing
# new is added to the supply chain by asking for them directly.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    # CreateJobObjectW takes security attributes, and the limits structure
    # counts I/O, so those two corners of the API come along with it.
    "Win32_Security",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The archive tests build their own gzip, so the module under test is the
# only thing being tested.
flate2.workspace = true
