<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Onsa — Siang Mimpi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2B2B5A}a:hover{color:#D0312D}
.sm-nav{display:block;padding:6px 12px;min-height:30px;background:#fff;border:1px solid #2B2B5A;box-shadow:3px 3px 0 rgba(43,43,90,0.25);font-family:'Pixelify Sans',sans-serif;font-size:14px;color:#2B2B5A;text-align:left;cursor:pointer}
.sm-cloud{position:absolute;border-radius:50%;background:#fff;filter:blur(10px)}
.sm-spark{position:absolute;color:#fff;text-shadow:0 0 6px #fff,0 0 12px #FFE9A8}
.sm-btn{width:44px;height:44px;background:#fff;border:1px solid #2B2B5A;box-shadow:2px 2px 0 rgba(43,43,90,0.3);color:#2B2B5A;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</helmet>
<div style="width:1000px;height:640px;box-sizing:border-box;background:linear-gradient(180deg,#7FB2EC 0%,#A9CFF5 30%,#E4F1FF 58%,#F7FBFF 62%);color:#2B2B5A;font-family:'Pixelify Sans',sans-serif;display:grid;grid-template-rows:1fr 76px;overflow:hidden;position:relative">
<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,0.55),rgba(255,255,255,0) 60%);pointer-events:none"></div>
<div class="sm-cloud" style="width:180px;height:46px;top:50px;left:250px;opacity:0.9"></div>
<div class="sm-cloud" style="width:120px;height:34px;top:96px;left:610px;opacity:0.75"></div>
<div class="sm-cloud" style="width:220px;height:50px;top:170px;left:420px;opacity:0.6"></div>
<span class="sm-spark" style="top:70px;left:540px;font-size:16px" aria-hidden="true">✧</span>
<span class="sm-spark" style="top:230px;left:250px;font-size:11px" aria-hidden="true">✧</span>
<span class="sm-spark" style="top:140px;left:880px;font-size:13px" aria-hidden="true">✧</span>
<svg width="64" height="30" viewBox="0 0 64 30" style="position:absolute;top:34px;left:780px;opacity:0.55" aria-hidden="true"><path d="M2 15 C 18 0, 46 0, 62 15 C 46 30, 18 30, 2 15 Z" fill="#fff" stroke="#5A6AA8" stroke-width="1.5"/><circle cx="32" cy="15" r="8" fill="#6A9BD8"/><circle cx="32" cy="15" r="3.5" fill="#1E2A50"/></svg>

<div style="position:relative;min-height:0">
<div style="position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg,#B9E08E 0%,#8CCB5E 40%,#6CB04A 100%)"></div>
<div style="position:absolute;left:0;right:0;bottom:40%;height:14px;background:linear-gradient(180deg,rgba(247,251,255,0),rgba(214,236,190,0.9));filter:blur(3px)"></div>

<nav aria-label="Navigasi" style="position:absolute;top:24px;left:24px;width:150px;display:flex;flex-direction:column;gap:9px">
<div style="font-family:'Gloock',serif;font-size:30px;color:#2B2B5A;margin-bottom:6px">onsa</div>
<button class="sm-nav" style="background:#FFF6C9">▸ sedang diputar</button>
<button class="sm-nav">library</button>
<button class="sm-nav">playlist</button>
<button class="sm-nav">unduhan</button>
<button class="sm-nav">rapikan</button>
<button class="sm-nav">pengaturan</button>
</nav>

<main style="position:absolute;top:28px;left:210px;width:430px;display:flex;flex-direction:column;gap:6px">
<div style="font-size:13px;color:#D0312D">kamu pernah ke sini sebelumnya.</div>
<h1 style="margin:0;font-family:'Gloock',serif;font-weight:400;font-size:58px;line-height:1;color:#2B2B5A;text-shadow:0 0 18px rgba(255,255,255,0.9)">Garpu Tala</h1>
<div style="font-size:16px">Contoh Artis — Album Contoh</div>
<div style="font-size:12px;color:#4A5A8A">flac · 44.1 kHz · 16-bit</div>
<div style="margin-top:14px;display:flex;flex-direction:column;gap:6px;font-family:'Gloock',serif;font-size:19px;line-height:1.3">
<div style="color:rgba(43,43,90,0.35)">gelombang datang dari tempat yang jauh</div>
<div style="color:#2B2B5A;text-shadow:0 0 12px #fff,0 0 4px #fff">aku mendengarnya sebelum melihatnya</div>
<div style="color:rgba(43,43,90,0.35)">gema kembali, lebih pelan dari tadi</div>
</div>
</main>

<div style="position:absolute;right:90px;bottom:16%;width:180px;height:290px;display:flex;flex-direction:column;align-items:center">
<div style="width:180px;height:280px;background:#F4EEDF;border:2px solid #C8BCA0;box-sizing:border-box;padding:12px;box-shadow:12px 6px 0 rgba(60,90,40,0.25)">
<div role="img" aria-label="Sampul lagu, terlihat lewat pintu yang terbuka" style="width:100%;height:100%;position:relative;background:linear-gradient(180deg,#FFE7A8,#FFB8D2 60%,#C9A8FF);box-shadow:inset 0 0 30px rgba(255,255,255,0.9),0 0 40px rgba(255,231,168,0.9)">
<div style="position:absolute;top:30%;left:50%;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#FFFBEA;box-shadow:0 0 24px #FFF2B8"></div>
<div style="position:absolute;bottom:0;left:0;right:0;height:22%;background-image:conic-gradient(#2B2B5A 25%,#F7F2FF 0 50%,#2B2B5A 0 75%,#F7F2FF 0);background-size:16px 16px;opacity:0.85"></div>
</div>
</div>
<div style="width:200px;height:8px;margin-top:-2px;border-radius:50%;background:rgba(40,70,30,0.35);filter:blur(2px)"></div>
</div>
<div style="position:absolute;right:270px;bottom:calc(16% + 12px);width:70px;height:256px;background:linear-gradient(90deg,#E6DCC4,#F4EEDF);border:2px solid #C8BCA0;box-sizing:border-box;transform:skewY(-14deg);transform-origin:right bottom" aria-hidden="true"></div>

<div aria-label="Spektrum sebagai rumput" role="img" style="position:absolute;left:190px;right:330px;bottom:0;height:34%;display:flex;align-items:flex-end;gap:3px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="40">
<div style="flex:1;height:{{b.h}};background:linear-gradient(0deg,#3E8A2E,#9ADB6A 80%,#E8FFC8);clip-path:polygon(50% 0,100% 100%,0 100%)"></div>
</sc-for>
</div>
</div>

<div style="display:flex;align-items:center;gap:14px;padding:0 24px;background:#F7F2FF;border-top:2px solid #2B2B5A">
<button class="sm-btn" aria-label="Sebelumnya"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 6 9 12l9 6V6zM6 6h2v12H6z"/></svg></button>
<button class="sm-btn" aria-label="Jeda" style="background:#FFF6C9;width:52px;height:52px"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
<button class="sm-btn" aria-label="Berikutnya"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m6 6 9 6-9 6V6zM16 6h2v12h-2z"/></svg></button>
<span style="font-size:18px">02:14</span>
<div style="flex:1;height:12px;border:1px solid #2B2B5A;background:#fff;position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:46%;background:repeating-linear-gradient(90deg,#8FC0F0 0 6px,#B9D8F8 6px 12px)"></div><span style="position:absolute;left:calc(46% - 7px);top:-9px;font-size:14px;color:#D0312D" aria-hidden="true">✦</span></div>
<span style="font-size:14px;color:#4A5A8A">04:51</span>
<span style="font-size:12px;display:flex;gap:6px"><span>flac</span><span style="color:#2E8A2E">rg</span><span style="color:#2E8A2E">eq</span><span style="color:#2E8A2E">lim</span></span>
<div aria-label="Meter" style="display:flex;flex-direction:column;gap:3px;width:60px">
<div style="height:6px;border:1px solid #2B2B5A;background:#fff"><div style="width:72%;height:100%;background:#7CC45A"></div></div>
<div style="height:6px;border:1px solid #2B2B5A;background:#fff"><div style="width:64%;height:100%;background:#7CC45A"></div></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    var bars = [];
    for (var i = 0; i < 40; i++) {
      var v = 0.25 + 0.55 * Math.abs(Math.sin(i * 0.45 + 0.7)) * (1 - i / 60) + 0.15 * Math.abs(Math.sin(i * 2.9));
      bars.push({ h: Math.round(Math.min(0.98, v) * 100) + '%' });
    }
    return { bars: bars };
  }
}
</script>
</body>
</html>
