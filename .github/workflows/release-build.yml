name: Release build

# What this produces is what other people are given: the optimised binary
# for each system, the list of what that binary asks the system for — which
# is how "it runs on a machine with no toolchain on it" is answered with
# evidence rather than belief — and, for Windows, the installer itself.
#
# It runs when it is asked for, and on a version tag. A release build is not
# something every commit needs, it takes far longer than the checks, and the
# Windows runner counts double against a private repository's minutes.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Nobody's key travels in a build made here. This makes the compiler
  # refuse a build that would carry one, so an installer that exists at all
  # is an installer with no key in it — see `keys.rs`.
  ONSA_KEYLESS: '1'
  # And the variables themselves are emptied, so the guard has nothing to
  # find even if the runner picked something up.
  ONSA_ACOUSTID_API_KEY: ''
  ONSA_LASTFM_API_KEY: ''
  ONSA_LASTFM_API_SECRET: ''

# The tag job publishes the installer with the release; nothing else here
# writes anything.
permissions:
  contents: write

jobs:
  build:
    name: release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost /usr/share/swift
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        working-directory: ui
        run: npm ci

      # The Tauri context embeds the built interface into the binary.
      - name: Build interface
        working-directory: ui
        run: npm run build

      # Says out loud what the guard in keys.rs enforces, and fails here
      # rather than three steps later if the environment is not what this
      # workflow says it is.
      - name: No keys in this build
        shell: bash
        run: |
          set -eu
          test "${ONSA_KEYLESS}" = "1"
          for name in ONSA_ACOUSTID_API_KEY ONSA_LASTFM_API_KEY ONSA_LASTFM_API_SECRET; do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then
              echo "$name is set in this build environment; a release build must carry no keys" >&2
              exit 1
            fi
            echo "$name: empty"
          done

      - name: Build the application
        run: cargo build --release -p onsa

      # The guard is read at compile time; this is the same thing said by
      # something that runs, on the same build environment.
      - name: Prove it at run time too
        run: 'cargo test --release -p onsa keys:: -- --nocapture'

      # What the binary asks of the system it lands on. Nothing here should
      # be a compiler, a runtime Onsa ships without, or anything that only
      # exists on a machine that builds software.
      - name: What it needs at run time
        if: runner.os == 'Linux'
        run: |
          ls -la target/release/onsa
          file target/release/onsa
          ldd target/release/onsa | sort

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        # Through bash, because the Tauri CLI has to be started from the
        # folder whose subfolder holds tauri.conf.json, and the shell
        # script in .bin is the one that does that on every platform.
        shell: bash
        run: ./ui/node_modules/.bin/tauri build --bundles nsis

      - name: What the installer is
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          ls -la target/release/bundle/nsis/
          for file in target/release/bundle/nsis/*.exe; do
            echo "$file"
            echo "  size: $(stat -c %s "$file") bytes"
            echo "  sha256: $(sha256sum "$file" | cut -d' ' -f1)"
          done

      - name: Keep the binary
        uses: actions/upload-artifact@v4
        with:
          name: onsa-${{ matrix.os }}
          path: |
            target/release/onsa
            target/release/onsa.exe
          if-no-files-found: error
          retention-days: 7

      - name: Keep the installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: onsa-installer-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      # On a version tag, the installer is what people are handed, so it is
      # published from here: the file that reaches them is the one this
      # workflow built, not one that passed through anybody's machine.
      - name: Publish it with the release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          notes="docs/rilis/${tag}.md"
          if [ ! -f "$notes" ]; then
            echo "there are no release notes at $notes" >&2
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Onsa $tag" --notes-file "$notes"
          fi
          gh release upload "$tag" target/release/bundle/nsis/*.exe --clobber
