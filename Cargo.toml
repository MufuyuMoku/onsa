[workspace]
resolver = "2"
members = [
    "crates/onsa-audio",
    "crates/onsa-library",
    "crates/onsa-downloader",
    "crates/onsa-lyrics",
    "crates/onsa-scrobble",
    "crates/onsa-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[workspace.dependencies]
onsa-audio = { path = "crates/onsa-audio" }
onsa-downloader = { path = "crates/onsa-downloader" }
onsa-library = { path = "crates/onsa-library" }
onsa-lyrics = { path = "crates/onsa-lyrics" }
onsa-scrobble = { path = "crates/onsa-scrobble" }

anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
cpal = "0.18"
rtrb = "0.4"
realfft = "3.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.25"
notify = "8.2"
notify-debouncer-full = "0.7"
# The one HTTP client for the whole project (SPEC §1). Tauri already
# compiles reqwest, but with its TLS turned off; reqwest's own defaults are
# rustls, which keeps Windows and Linux on the same code and needs no system
# OpenSSL. Blocking, because every network call in Onsa happens on a worker
# thread already.
reqwest = { version = "0.13", features = ["blocking", "json", "gzip", "query"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
sha2 = "0.10"
rubato = "5"
symphonia = { version = "0.6", features = ["aac", "aiff", "alac", "isomp4", "mp3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Debug information is the biggest thing in `target/`, and neither the tests
# nor a development build needs it: panics still name the functions they
# came from. Leaving it out keeps the folder, and the CI cache built from
# it, a fraction of the size. `strip` alone would not do: it only tidies the
# finished binaries, not the libraries every crate leaves behind. Add
# `debug = true` back locally when a debugger is needed.
[profile.dev]
debug = false

[profile.test]
debug = false
