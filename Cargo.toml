[workspace]
resolver = "2"
members = [
    "crates/onsa-audio",
    "crates/onsa-library",
    "crates/onsa-downloader",
    "crates/onsa-lyrics",
    "crates/onsa-scrobble",
    "crates/onsa-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[workspace.dependencies]
onsa-audio = { path = "crates/onsa-audio" }
onsa-downloader = { path = "crates/onsa-downloader" }
onsa-library = { path = "crates/onsa-library" }
onsa-lyrics = { path = "crates/onsa-lyrics" }
onsa-scrobble = { path = "crates/onsa-scrobble" }

anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
cpal = "0.18"
rtrb = "0.4"
realfft = "3.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.25"
notify = "8.2"
notify-debouncer-full = "0.7"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
rubato = "5"
symphonia = { version = "0.6", features = ["aac", "aiff", "alac", "isomp4", "mp3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
